name: marauder-contract

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  marauder-db:
    image: postgres:16-alpine
    container_name: marauder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marauder
      POSTGRES_USER: marauder
      POSTGRES_PASSWORD: marauder_secret
    volumes:
      - marauder-db-data:/var/lib/postgresql/data
    ports:
      - "5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marauder -d marauder"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Express.js API ─────────────────────────────────────────────────────────
  marauder-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: marauder-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: marauder-db
      DB_PORT: "5432"
      DB_NAME: marauder
      DB_USER: marauder
      DB_PASSWORD: marauder_secret
      ADMIN_KEY: marauder
    ports:
      - "8078:3000"
    depends_on:
      marauder-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx + Vite Frontend ──────────────────────────────────────────────────
  marauder-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: marauder-frontend
    restart: unless-stopped
    ports:
      - "8077:80"
    depends_on:
      marauder-api:
        condition: service_healthy
    networks:
      - default
      - wireguard_wg-network

networks:
  wireguard_wg-network:
    external: true

volumes:
  marauder-db-data:
